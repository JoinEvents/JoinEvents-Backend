name: Deploy to Azure App Service

# Deploys the API to Azure App Service using a publish profile.
#
# IMPORTANT: this deploys whatever is on the branch below. Point it at the branch
# that actually carries the security hardening — deploying an unhardened branch
# ships the seeded administrator account and client-controlled booking prices.
on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  # Copy this from the App Service Overview page. It is the resource name, NOT the
  # full hostname: for joinevents-api-chiru-xxxx.centralindia-01.azurewebsites.net
  # the app name is joinevents-api-chiru.
  AZURE_WEBAPP_NAME: joinevents-api-chiru
  DOTNET_VERSION: '8.0.x'

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore EventEase.sln

      - name: Build
        run: dotnet build EventEase.sln -c Release --no-restore

      # Tests run before publish on purpose: a failing build here costs two minutes,
      # a broken deploy costs an afternoon of guessing at App Service logs.
      - name: Test
        run: dotnet test EventEase.sln -c Release --no-build --verbosity normal

      - name: Publish
        run: dotnet publish EventEase/EventEase.Api.csproj -c Release -o ${{ runner.temp }}/publish --no-build

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ runner.temp }}/publish

      # Liveness only. /health opens a database connection, and polling that keeps a
      # serverless database awake at the cost of its monthly free allowance.
      - name: Smoke test
        run: |
          URL="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/health/live"
          echo "Checking $URL"
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "$URL" || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "App is up."
              exit 0
            fi
            echo "Attempt $i returned $CODE; the app may still be starting."
            sleep 20
          done
          echo "::warning::Liveness check did not return 200. Check App Service log stream."
