# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - JoinEvents-Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build with dotnet
        run: dotnet build EventEase.sln --configuration Release

      # Deploying an untested build costs far more time than the tests take.
      - name: Test
        run: dotnet test EventEase.sln --configuration Release --no-build

      # Publish the API project specifically. Publishing the solution would also
      # emit the test project into the same folder and ship it to App Service.
      - name: dotnet publish
        run: dotnet publish EventEase/EventEase.Api.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  # The schema goes first, so newly deployed code never starts against a database
  # that is missing what it expects. Additive migrations leave the running
  # instance working throughout. Without AZURE_SQL_CONNECTION_STRING set this
  # only produces migration.sql as an artifact and the deploy carries on — see
  # .github/workflows/migrate-database.yml.
  migrate:
    needs: build
    uses: ./.github/workflows/migrate-database.yml
    secrets: inherit

  deploy:
    runs-on: windows-latest
    needs: [build, migrate]
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E35574C356C541CF97B5C02EFF4F09DA }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_FE3A9091EB5C44FA86A5B02CEAD20FE7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0C31C7B1A18144DA86C68AE4DD6407A4 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'joinevents-api-chiru-gse0abhtd7gkbzaz'
          slot-name: 'Production'
          package: .
          